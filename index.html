
<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Human Architecture | عمارة الإنسان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              alabaster: '#F9F9F9', // Whiter background for clean look
              concrete: '#E6E2DD',
              slate: '#64748B',
              bronze: '#C5A065',
              charcoal: '#1E293B',
              darkBg: '#0F0F0F',
              blueprint: '#003366', // The new Primary Blue
              blueprintLine: '#4da6ff',
            },
            fontFamily: {
              amiri: ['Amiri', 'serif'], // Keep for Arabic
              ibm: ['IBM Plex Sans Arabic', 'sans-serif'], // Keep for Arabic
              serif: ['Lora', 'Playfair Display', 'serif'], // Updated for English Headings
              sans: ['Inter', 'Montserrat', 'sans-serif'], // Updated for English Body
              mono: ['IBM Plex Mono', 'monospace'],
            },
            cursor: {
              none: 'none',
            },
            animation: {
              'spin-slow': 'spin 10s linear infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scan': 'scan 3s linear infinite',
            },
            keyframes: {
              scan: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              }
            }
          },
        },
      }
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F9F9F9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #003366; 
        border-radius: 3px;
      }
      
      body {
        cursor: none;
        overflow-x: hidden;
      }

      /* Luxury Mode Grid - Refined for Blueprint Style */
      .architectural-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(0, 51, 102, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(0, 51, 102, 0.05) 1px, transparent 1px);
      }
      
      /* Dark Mode Grid */
      .dark .architectural-grid {
         background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      }

      /* BLUEPRINT MODE STYLES */
      body.blueprint-mode {
        background-color: #002b4d !important;
        color: #89cff0 !important;
      }
      
      body.blueprint-mode .architectural-grid {
        background-size: 20px 20px;
        background-image: linear-gradient(to right, rgba(137, 207, 240, 0.2) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(137, 207, 240, 0.2) 1px, transparent 1px);
      }

      body.blueprint-mode .bg-alabaster,
      body.blueprint-mode .bg-white,
      body.blueprint-mode .bg-concrete {
        background-color: rgba(0, 43, 77, 0.95) !important;
        border-color: rgba(137, 207, 240, 0.5) !important;
        color: #89cff0 !important;
      }

      body.blueprint-mode .text-charcoal,
      body.blueprint-mode .text-slate,
      body.blueprint-mode .text-blueprint {
        color: #a8d8f0 !important;
      }
      
      body.blueprint-mode .text-bronze {
        color: #ffffff !important;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
      }

      body.blueprint-mode img {
        filter: grayscale(100%) sepia(100%) hue-rotate(190deg) saturate(300%) contrast(1.2);
        opacity: 0.9;
        mix-blend-mode: screen;
        border: 1px solid #89cff0;
      }

      /* Noise Texture */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
      }

      ::selection {
        background: #003366;
        color: #fff;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0"
  }
}
</script>
</head>
  <body class="bg-alabaster text-charcoal antialiased transition-colors duration-700 overflow-x-hidden">
    <div id="root"></div>
    <!-- CRITICAL: This connects your index.tsx to the HTML -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
