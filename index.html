<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Human Architecture | عمارة الإنسان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              alabaster: '#F2F0EB',
              concrete: '#E6E2DD',
              slate: '#8C9598',
              bronze: '#C5A065',
              charcoal: '#2B2B2B',
              darkBg: '#050505',
              blueprint: '#003366',
              blueprintLine: '#4da6ff',
            },
            fontFamily: {
              amiri: ['Amiri', 'serif'],
              ibm: ['IBM Plex Sans Arabic', 'sans-serif'],
              serif: ['Playfair Display', 'Lora', 'serif'],
              sans: ['Inter', 'Montserrat', 'sans-serif'],
              mono: ['IBM Plex Mono', 'monospace'],
            },
            cursor: {
              none: 'none',
            },
            animation: {
              'spin-slow': 'spin 10s linear infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scan': 'scan 3s linear infinite',
            },
            keyframes: {
              scan: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              }
            }
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-thumb { background: #C5A065; border-radius: 3px; }
      
      body {
        cursor: none;
        overflow-x: hidden;
        background-color: #050505;
        color: #E6E2DD;
      }

      .architectural-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(140, 149, 152, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(140, 149, 152, 0.05) 1px, transparent 1px);
      }

      .noise-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 9999; opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
      }

      ::selection { background: #C5A065; color: #000; }

      body.blueprint-mode { background-color: #002b4d !important; color: #89cff0 !important; }
      body.blueprint-mode .architectural-grid {
        background-image: linear-gradient(to right, rgba(137, 207, 240, 0.1) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(137, 207, 240, 0.1) 1px, transparent 1px);
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
        "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.33.0"
      }
    }
    </script>
  </head>
  <body class="bg-darkBg text-concrete antialiased transition-colors duration-700 overflow-x-hidden">
    <div class="noise-overlay"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
